[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "mad-mcp-qdrant"
version = "2.0.0"
description = "Authenticated dual-mode MCP server for bounded Qdrant vector memory, retrieval, ingestion, and maintenance"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "MADPANDA3D" }]
keywords = [
    "mcp",
    "qdrant",
    "vector-search",
    "vector-memory",
    "ai-agents",
    "fastmcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
]
dependencies = [
    "fastembed>=0.8.0,<1",
    "fastmcp>=3.4.4,<4",
    "httpx>=0.28.1,<1",
    "mcp>=1.28.1,<2",
    "openai>=2.46.0,<3",
    "pdf2image>=1.17.0,<2",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "pypdf>=6.14.2,<7",
    "python-docx>=1.2.0,<2",
    "pytesseract>=0.3.13,<1",
    "qdrant-client>=1.18.0,<2",
    "starlette>=1.3.1,<2",
]

[project.urls]
Homepage = "https://github.com/MADPANDA3D/QDRANT-MCP"
Documentation = "https://github.com/MADPANDA3D/QDRANT-MCP#readme"
Issues = "https://github.com/MADPANDA3D/QDRANT-MCP/issues"
Security = "https://github.com/MADPANDA3D/QDRANT-MCP/security/policy"
Source = "https://github.com/MADPANDA3D/QDRANT-MCP"

[dependency-groups]
dev = [
    "build>=1.3.0,<2",
    "pip-audit>=2.9.0,<3",
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.15.0,<1",
    "twine>=6.2.0,<7",
]

[project.scripts]
mcp-server-qdrant = "mcp_server_qdrant.main:main"
mad-mcp-qdrant = "mcp_server_qdrant.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_qdrant"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/mcp_server_qdrant",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
required-version = "==0.11.29"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
