  MCP_QDRANT_HOST_ALLOWLIST: ${MCP_QDRANT_HOST_ALLOWLIST:-}
  MCP_QDRANT_ALLOWED_PORTS: ${MCP_QDRANT_ALLOWED_PORTS:-443,6333}
  MCP_OPENAI_HOST_ALLOWLIST: ${MCP_OPENAI_HOST_ALLOWLIST:-api.openai.com}
  MCP_OPENAI_ALLOWED_PORTS: ${MCP_OPENAI_ALLOWED_PORTS:-443}
  MCP_QDRANT_URL_HEADER: ${MCP_QDRANT_URL_HEADER:-x-qdrant-url}
  MCP_QDRANT_API_KEY_HEADER: ${MCP_QDRANT_API_KEY_HEADER:-x-qdrant-api-key}
  MCP_COLLECTION_NAME_HEADER: ${MCP_COLLECTION_NAME_HEADER:-x-collection-name}
  MCP_QDRANT_VECTOR_NAME_HEADER: ${MCP_QDRANT_VECTOR_NAME_HEADER:-x-qdrant-vector-name}
  MCP_EMBEDDING_PROVIDER_HEADER: ${MCP_EMBEDDING_PROVIDER_HEADER:-x-embedding-provider}
  MCP_EMBEDDING_MODEL_HEADER: ${MCP_EMBEDDING_MODEL_HEADER:-x-embedding-model}
  MCP_EMBEDDING_VECTOR_SIZE_HEADER: ${MCP_EMBEDDING_VECTOR_SIZE_HEADER:-x-embedding-vector-size}
  MCP_OPENAI_API_KEY_HEADER: ${MCP_OPENAI_API_KEY_HEADER:-x-openai-api-key}
  MCP_OPENAI_BASE_URL_HEADER: ${MCP_OPENAI_BASE_URL_HEADER:-x-openai-base-url}
  MCP_OPENAI_ORG_HEADER: ${MCP_OPENAI_ORG_HEADER:-x-openai-org}
  MCP_OPENAI_PROJECT_HEADER: ${MCP_OPENAI_PROJECT_HEADER:-x-openai-project}
  MCP_ADMIN_TOOLS_ENABLED: ${MCP_ADMIN_TOOLS_ENABLED:-false}
  MCP_MUTATIONS_REQUIRE_ADMIN: ${MCP_MUTATIONS_REQUIRE_ADMIN:-false}
  MCP_MAX_BATCH_SIZE: ${MCP_MAX_BATCH_SIZE:-500}
  MCP_MAX_POINT_IDS: ${MCP_MAX_POINT_IDS:-500}
  MCP_STRICT_PARAMS: ${MCP_STRICT_PARAMS:-false}
  MCP_MAX_TEXT_LENGTH: ${MCP_MAX_TEXT_LENGTH:-8000}
  QDRANT_READ_ONLY: ${QDRANT_READ_ONLY:-false}
  QDRANT_ALLOW_ARBITRARY_FILTER: ${QDRANT_ALLOW_ARBITRARY_FILTER:-false}
  QDRANT_SEARCH_LIMIT: ${QDRANT_SEARCH_LIMIT:-10}
  MCP_QUERY_EMBEDDING_CACHE_SIZE: ${MCP_QUERY_EMBEDDING_CACHE_SIZE:-256}
  MCP_QUERY_EMBEDDING_CACHE_TTL_SECONDS: ${MCP_QUERY_EMBEDDING_CACHE_TTL_SECONDS:-3600}
  MCP_DEDUPE_ACTION: ${MCP_DEDUPE_ACTION:-update}
  MCP_INGEST_VALIDATION_MODE: ${MCP_INGEST_VALIDATION_MODE:-allow}
  MCP_QUARANTINE_COLLECTION: ${MCP_QUARANTINE_COLLECTION:-quarantine}
  MCP_HEALTH_CHECK_COLLECTION: ${MCP_HEALTH_CHECK_COLLECTION:-}
  MCP_SHORT_TERM_COLLECTION: ${MCP_SHORT_TERM_COLLECTION:-short-term}
  MCP_STUDY_COLLECTION: ${MCP_STUDY_COLLECTION:-study}
  MCP_SHORT_TERM_TTL_DAYS: ${MCP_SHORT_TERM_TTL_DAYS:-7}
  MCP_TEXTBOOK_MAX_FILE_BYTES: ${MCP_TEXTBOOK_MAX_FILE_BYTES:-262144000}
  MCP_FILE_UPLOAD_MAX_CHUNK_BYTES: ${MCP_FILE_UPLOAD_MAX_CHUNK_BYTES:-524288}
  MCP_FILE_UPLOAD_MAX_ACTIVE_PER_OWNER: ${MCP_FILE_UPLOAD_MAX_ACTIVE_PER_OWNER:-4}
  MCP_FILE_UPLOAD_MAX_ACTIVE_GLOBAL: ${MCP_FILE_UPLOAD_MAX_ACTIVE_GLOBAL:-32}
  MCP_FILE_UPLOAD_MAX_AGGREGATE_BYTES_PER_OWNER: ${MCP_FILE_UPLOAD_MAX_AGGREGATE_BYTES_PER_OWNER:-268435456}
  MCP_FILE_UPLOAD_MAX_AGGREGATE_BYTES_GLOBAL: ${MCP_FILE_UPLOAD_MAX_AGGREGATE_BYTES_GLOBAL:-536870912}
  MCP_TEXTBOOK_MAX_PAGES: ${MCP_TEXTBOOK_MAX_PAGES:-5000}
  MCP_TEXTBOOK_MAX_EXTRACTED_CHARS: ${MCP_TEXTBOOK_MAX_EXTRACTED_CHARS:-12000000}
  MCP_TEXTBOOK_MAX_CHUNKS: ${MCP_TEXTBOOK_MAX_CHUNKS:-80000}
  MCP_TEXTBOOK_OCR_LOW_TEXT_THRESHOLD_CHARS: ${MCP_TEXTBOOK_OCR_LOW_TEXT_THRESHOLD_CHARS:-120}
  MCP_TEXTBOOK_OCR_MIN_COVERAGE_RATIO: ${MCP_TEXTBOOK_OCR_MIN_COVERAGE_RATIO:-0.85}
  MCP_TEXTBOOK_OCR_MAX_PAGES: ${MCP_TEXTBOOK_OCR_MAX_PAGES:-120}
  MCP_TEXTBOOK_OCR_MAX_PAGE_RATIO: ${MCP_TEXTBOOK_OCR_MAX_PAGE_RATIO:-0.30}
  MCP_TEXTBOOK_JOB_TIMEOUT_SECONDS: ${MCP_TEXTBOOK_JOB_TIMEOUT_SECONDS:-7200}
  MCP_TEXTBOOK_EMBED_BATCH_SIZE: ${MCP_TEXTBOOK_EMBED_BATCH_SIZE:-32}
  MCP_TEXTBOOK_UPSERT_BATCH_SIZE: ${MCP_TEXTBOOK_UPSERT_BATCH_SIZE:-64}
  MCP_TEXTBOOK_MAX_CONCURRENCY: ${MCP_TEXTBOOK_MAX_CONCURRENCY:-2}
  MCP_TEXTBOOK_JOB_STATE_DIR: /tmp/mcp-server-qdrant/jobs
  MCP_TEXTBOOK_JOB_STATE_RETENTION_HOURS: ${MCP_TEXTBOOK_JOB_STATE_RETENTION_HOURS:-168}
  MCP_BACKGROUND_JOB_MAX_ACTIVE_PER_OWNER: ${MCP_BACKGROUND_JOB_MAX_ACTIVE_PER_OWNER:-2}
  MCP_BACKGROUND_JOB_MAX_ACTIVE_GLOBAL: ${MCP_BACKGROUND_JOB_MAX_ACTIVE_GLOBAL:-16}
  MCP_BACKGROUND_JOB_MAX_RETAINED_PER_OWNER: ${MCP_BACKGROUND_JOB_MAX_RETAINED_PER_OWNER:-20}
  MCP_BACKGROUND_JOB_MAX_RETAINED_GLOBAL: ${MCP_BACKGROUND_JOB_MAX_RETAINED_GLOBAL:-100}
  MCP_BACKGROUND_JOB_LOG_MESSAGE_MAX_CHARS: ${MCP_BACKGROUND_JOB_LOG_MESSAGE_MAX_CHARS:-512}
  MCP_BACKGROUND_JOB_MAX_LOGS_PER_JOB: ${MCP_BACKGROUND_JOB_MAX_LOGS_PER_JOB:-100}
  MCP_BACKGROUND_JOB_MAX_LOG_TAIL: ${MCP_BACKGROUND_JOB_MAX_LOG_TAIL:-100}
  MCP_BACKGROUND_JOB_MAX_RESULT_BYTES: ${MCP_BACKGROUND_JOB_MAX_RESULT_BYTES:-262144}
  MCP_BACKGROUND_JOB_MAX_RECORD_BYTES: ${MCP_BACKGROUND_JOB_MAX_RECORD_BYTES:-524288}

x-qdrant-service: &qdrant-service
  build:
    context: .
    args:
      BUILD_SHA: ${MCP_BUILD_SHA:-development}
      SOURCE_FINGERPRINT: ${MCP_SOURCE_FINGERPRINT:-development}
      IMAGE_VERSION: ${MCP_IMAGE_VERSION:-2.0.0-dev}
  image: ${MCP_RUNTIME_IMAGE:-qdrant-mcp:local-source}
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  mem_limit: 2g
  cpus: 2.0
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=1g,mode=1777
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import json,urllib.request; o=urllib.request.build_opener(urllib.request.ProxyHandler({})); r=o.open('http://127.0.0.1:8000/health',timeout=3); b=r.read(65537); r.close(); p=json.loads(b); assert len(b) <= 65536 and p.get('ok') is True and p.get('version') == '2.0.0' and isinstance(p.get('build_sha'),str) and int(p.get('tool_count',0)) > 0"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s
  ports:
    - "127.0.0.1:${MCP_HOST_PORT:-8000}:8000"

services:
  qdrant-mcp-standalone:
    <<: *qdrant-service
    profiles: [standalone]
    container_name: qdrant-mcp-standalone
    environment:
      <<: *qdrant-environment
      MCP_MODE: standalone
      MCP_ACCESS_TOKEN: ${MCP_ACCESS_TOKEN:-}
      MCP_PORTAL_GRANT_TOKEN: ""
      MCP_PORTAL_GRANT_HEADER: ${MCP_PORTAL_GRANT_HEADER:-x-madpanda-portal-grant}
      QDRANT_CREDENTIAL_MODE: server
      MCP_ALLOW_REQUEST_OVERRIDES: "false"
      MCP_REQUIRE_REQUEST_QDRANT_URL: "false"
      MCP_DISABLE_DEFAULT_QDRANT_FALLBACK: "false"
      MCP_DISABLE_DEFAULT_EMBEDDING_FALLBACK: "false"
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

  qdrant-mcp-standalone-request:
    <<: *qdrant-service
    profiles: [standalone-request]
    container_name: qdrant-mcp-standalone-request
    environment:
      <<: *qdrant-environment
      MCP_MODE: standalone
      MCP_ACCESS_TOKEN: ${MCP_ACCESS_TOKEN:-}
      MCP_PORTAL_GRANT_TOKEN: ""
      MCP_PORTAL_GRANT_HEADER: ${MCP_PORTAL_GRANT_HEADER:-x-madpanda-portal-grant}
      QDRANT_CREDENTIAL_MODE: request
      MCP_ALLOW_REQUEST_OVERRIDES: "true"
      MCP_REQUIRE_REQUEST_QDRANT_URL: "true"
      MCP_REQUIRE_REQUEST_QDRANT_API_KEY: "true"
      MCP_REQUIRE_REQUEST_COLLECTION: ${MCP_REQUIRE_REQUEST_COLLECTION:-false}
      MCP_DISABLE_DEFAULT_QDRANT_FALLBACK: "true"
      MCP_DISABLE_DEFAULT_EMBEDDING_FALLBACK: ${MCP_DISABLE_DEFAULT_EMBEDDING_FALLBACK:-false}
      QDRANT_URL: ""
      QDRANT_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_ORG: ""
      OPENAI_PROJECT: ""

  qdrant-mcp-portal:
    <<: *qdrant-service
    profiles: [portal]
    container_name: qdrant-mcp-portal
    environment:
      <<: *qdrant-environment
      MCP_MODE: portal
      MCP_ACCESS_TOKEN: ""
      MCP_PORTAL_GRANT_TOKEN: ${MCP_PORTAL_GRANT_TOKEN:-}
      MCP_PORTAL_GRANT_HEADER: ${MCP_PORTAL_GRANT_HEADER:-x-madpanda-portal-grant}
      MCP_TENANT_ID_HEADER: ${MCP_TENANT_ID_HEADER:-x-madpanda-user-id}
      QDRANT_CREDENTIAL_MODE: request
      MCP_ALLOW_REQUEST_OVERRIDES: "true"
      MCP_REQUIRE_REQUEST_QDRANT_URL: "true"
      MCP_REQUIRE_REQUEST_QDRANT_API_KEY: "true"
      MCP_REQUIRE_REQUEST_COLLECTION: ${MCP_REQUIRE_REQUEST_COLLECTION:-false}
      MCP_DISABLE_DEFAULT_QDRANT_FALLBACK: "true"
      MCP_DISABLE_DEFAULT_EMBEDDING_FALLBACK: ${MCP_DISABLE_DEFAULT_EMBEDDING_FALLBACK:-false}
      QDRANT_URL: ""
      QDRANT_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_ORG: ""
      OPENAI_PROJECT: ""
