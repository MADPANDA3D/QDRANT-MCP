  MCP_IMAGE_REFERENCE: ${MCP_RUNTIME_IMAGE:-qdrant-mcp:local-source}
  MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost:*,127.0.0.1:*,[::1]:*,qdrant-mcp-standalone:*,qdrant-mcp-standalone-request:*,qdrant-mcp-portal:*}
  MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
  MCP_REQUEST_BODY_MAX_BYTES: ${MCP_REQUEST_BODY_MAX_BYTES:-1048576}
  MCP_REQUEST_BODY_TIMEOUT_SECONDS: ${MCP_REQUEST_BODY_TIMEOUT_SECONDS:-10}
  COLLECTION_NAME: ${COLLECTION_NAME:-}
  QDRANT_VECTOR_NAME: ${QDRANT_VECTOR_NAME:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
  EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-}
  EMBEDDING_VERSION: ${EMBEDDING_VERSION:-}
  HF_HUB_OFFLINE: "1"
  FASTEMBED_MODEL_PATH: /opt/qdrant-mcp/models/all-MiniLM-L6-v2
  FASTEMBED_MODEL_REVISION: qdrant/all-MiniLM-L6-v2-onnx@5f1b8cd78bc4fb444dd171e59b18f3a3af89a079
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  OPENAI_ORG: ${OPENAI_ORG:-}
  OPENAI_PROJECT: ${OPENAI_PROJECT:-}
  MCP_OUTBOUND_HOST_ALLOWLIST: ${MCP_OUTBOUND_HOST_ALLOWLIST:-}
  MCP_OUTBOUND_ALLOWED_PORTS: ${MCP_OUTBOUND_ALLOWED_PORTS:-443}
